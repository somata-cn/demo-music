<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netease Music Pages</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="wrap">
    <h1>网易云解析</h1>

    <section class="box form">
      <select id="mode">
        <option value="single">单曲</option>
        <option value="playlist" selected>歌单</option>
      </select>
      <select id="quality">
        <option value="standard">标准</option>
        <option value="higher">较高</option>
        <option value="exhigh">极高</option>
        <option value="lossless">无损</option>
        <option value="hires" selected>Hi-Res</option>
      </select>
      <input id="target" type="text" autocomplete="off" placeholder="粘贴单曲链接或数字 ID">
      <button id="submit" type="button">解析</button>
    </section>

    <p id="message" class="message" aria-live="polite"></p>
    <p id="loading" class="message" hidden>正在请求...</p>

    <section class="box single" id="singleCard" hidden>
      <img id="singleCover" alt="歌曲封面">
      <div>
        <h2 id="singleTitle">-</h2>
        <p id="singleMeta">-</p>
        <p id="singleExtra">-</p>
        <audio id="singleAudio" controls></audio>
        <button id="singleDownload" type="button">下载当前单曲</button>
      </div>
    </section>

    <section class="box" id="playlistCard" hidden>
      <div class="single">
        <img id="playlistCover" alt="歌单封面">
        <div>
          <h2 id="playlistTitle">-</h2>
          <p id="playlistMeta">-</p>
          <p id="playlistExtra">-</p>
          <div class="batch">
            <select id="delay">
              <option value="30000">30s</option>
              <option value="60000">1min</option>
              <option value="180000" >3min</option>
              <option value="600000" selected>10min</option>
            </select>
            <button id="playlistDownload" type="button">批量下载</button>
            <span id="progress">等待</span>
          </div>
        </div>
      </div>
      <div id="tracks" class="tracks"></div>
    </section>
  </main>
</body>
</html>
