<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netease Music Pages</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary: #9d4edd;
      --secondary: #ff006e;
      --tertiary: #3a86ff;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      min-height: 100vh;
      background: #0f0c29;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      overflow-x: hidden;
      position: relative;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.6;
      animation: float 10s infinite ease-in-out alternate;
    }

    .blob-1 {
      width: 400px;
      height: 400px;
      background: var(--primary);
      top: -100px;
      left: -100px;
    }

    .blob-2 {
      width: 500px;
      height: 500px;
      background: var(--secondary);
      bottom: -150px;
      right: -100px;
      animation-delay: -5s;
    }

    .blob-3 {
      width: 300px;
      height: 300px;
      background: var(--tertiary);
      bottom: 20%;
      left: 10%;
      animation-delay: -2s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(30px, 30px) scale(1.1);
      }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 900px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      animation: slideUp 0.8s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      margin-bottom: 0.5rem;
      font-size: 2.5rem;
      background: linear-gradient(to right, #ff006e, #9d4edd, #3a86ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .mode-tabs {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 10px 24px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1rem;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #9d4edd, #3a86ff);
      border-color: transparent;
      box-shadow: 0 0 15px rgba(58, 134, 255, 0.5);
    }

    .search-box {
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: border-color 0.3s;
    }

    .search-box:focus-within {
      border-color: var(--tertiary);
      box-shadow: 0 0 15px rgba(58, 134, 255, 0.4);
    }

    input,
    select {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 1.1rem;
      padding: 10px 15px;
      outline: none;
      font-family: inherit;
    }

    select option {
      background: #24243e;
      color: white;
    }

    select {
      flex: 0 0 130px;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    button.primary-btn {
      background: linear-gradient(135deg, #9d4edd, #ff006e);
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    button.primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 0, 110, 0.4);
    }

    button:disabled {
      background: rgba(255, 255, 255, 0.1);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #loading {
      display: none;
      text-align: center;
      margin: 2rem 0;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--secondary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    #message {
      text-align: center;
      margin-top: 1rem;
      min-height: 24px;
      color: #ff4d4f;
    }

    /* Results */
    #result-single,
    #result-playlist {
      display: none;
      margin-top: 2rem;
      animation: fadeIn 0.5s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Single Song Card */
    .song-card {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .song-details {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .cover {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .info h3 {
      font-size: 1.5rem;
    }

    .info p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
    }

    .tags {
      display: flex;
      gap: 8px;
      margin-top: 5px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.1);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    .audio-player {
      width: 100%;
      margin-top: 1rem;
      border-radius: 8px;
    }

    /* Playlist Table */
    .playlist-header {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .playlist-header img {
      width: 150px;
      height: 150px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .batch-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .delay-config {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
    }

    .delay-config input,
    .delay-config select {
      width: 110px;
      flex: 0 0 auto;
      padding: 8px 10px;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.2);
    }

    .playlist-list {
      max-height: 500px;
      overflow-y: auto;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .playlist-list::-webkit-scrollbar {
      width: 8px;
    }

    .playlist-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }

    .playlist-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .track-item {
      display: flex;
      align-items: center;
      padding: 12px 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.3s;
    }

    .track-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .track-index {
      width: 40px;
      color: rgba(255, 255, 255, 0.5);
      font-family: monospace;
    }

    .track-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding-right: 15px;
    }

    .track-name {
      font-weight: 500;
      font-size: 1.05rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
    }

    .track-act button {
      background: linear-gradient(135deg, #3a86ff, #00f2fe);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: transform 0.2s;
    }

    .track-act button:hover {
      transform: scale(1.05);
    }

    .track-act button:disabled {
      background: gray;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 600px) {
      .search-box {
        flex-direction: column;
      }

      select {
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .song-details,
      .playlist-header {
        flex-direction: column;
        text-align: center;
      }

      .batch-controls,
      .delay-config {
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="container">
    <h1>Netease Music Pages</h1>
    <!-- <div class="subtitle">根据网易云下载</div> -->
    <div style="text-align:center; margin-bottom:1.5rem;">
      <a href="https://music.163.com/" target="_blank" rel="noopener noreferrer" style="color: #fff; text-decoration: none; background: rgba(255,255,255,0.08); padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15); transition: transform 0.2s, background 0.2s;">
        访问官方网易云音乐
      </a>
    </div>

    <div class="mode-tabs">
      <button class="tab-btn active" id="tab-single" onclick="setMode('single')">单曲解析</button>
      <button class="tab-btn" id="tab-playlist" onclick="setMode('playlist')">歌单解析</button>
    </div>

    <div class="input-group">
      <div class="search-box">
        <select id="quality">
          <option value="standard">标准音质</option>
          <option value="higher">较高音质</option>
          <option value="exhigh" >极高音质</option>
          <option value="lossless">无损音质</option>
          <option value="hires" selected>Hi-Res音质</option>
        </select>
        <input type="text" id="targetId" placeholder="粘贴歌曲链接或ID" autocomplete="off">
        <button class="primary-btn" id="searchBtn" onclick="resolveTarget()">开始解析</button>
      </div>
    </div>

    <div id="message"></div>

    <div id="loading">
      <div class="spinner"></div>
      <p style="margin-top: 15px; color: rgba(255,255,255,0.8);">正在连接API...</p>
    </div>

    <!-- 单曲结果 -->
    <div id="result-single">
      <div class="song-card">
        <div class="song-details">
          <img id="s-cover" src="" alt="Cover" class="cover">
          <div class="info">
            <h3 id="s-title">-</h3>
            <p id="s-artist">-</p>
            <p id="s-album">-</p>
            <div class="tags">
              <span class="tag" id="s-duration">-</span>
              <span class="tag" id="s-quality">-</span>
            </div>
          </div>
        </div>
        <audio id="s-audio" controls class="audio-player"></audio>
        <button class="primary-btn" onclick="directDownloadSingle()"
          style="width:100%; background: linear-gradient(135deg, #3a86ff, #00f2fe);">极速下载</button>
      </div>
    </div>

    <!-- 歌单结果 -->
    <div id="result-playlist">
      <div class="playlist-header">
        <img id="p-cover" src="" alt="Playlist Cover">
        <div class="info">
          <h3 id="p-title">-</h3>
          <p id="p-creator">-</p>
          <p id="p-desc" style="max-height: 60px; overflow:hidden; text-overflow:ellipsis;">-</p>
          <div class="tags">
            <span class="tag" id="p-count">共 0 首</span>
            <span class="tag" id="p-playcount">0 次播放</span>
          </div>
          <div class="batch-controls">
            <label class="delay-config" for="batchDelay">
              <span>下载间隔</span>
              <select id="batchDelay">
                <option value="10000">10s</option>
                <option value="30000">30s</option>
                <option value="60000">1min</option>
                <option value="180000" selected>3min</option>
                <option value="600000">10min</option>
                <option value="0">无间隔</option>
              </select>
            </label>
            <button id="batchDownloadBtn" class="primary-btn" onclick="downloadWholePlaylist()"
              style="padding: 8px 15px; font-size: 0.9rem; background: linear-gradient(135deg, #3a86ff, #00f2fe);">
              一键下载全部 (<span id="p-download-progress">等待</span>)
            </button>
          </div>
        </div>
      </div>

      <div class="playlist-list" id="trackList">
        <!-- Tracks will be rendered here -->
      </div>
    </div>

  </div>

  <script>
    let mode = 'single';
    let currentSingleData = null;
    let currentPlaylistSongs = [];
    let isBatchDownloading = false;
    const qualitySelect = document.getElementById('quality');
    const batchDelayInput = document.getElementById('batchDelay');
    const msg = document.getElementById('message');
    const loading = document.getElementById('loading');
    const btn = document.getElementById('searchBtn');

    function getBatchDelayMs() {
      const value = Number(batchDelayInput.value);
      if (!Number.isFinite(value) || value < 0) {
        batchDelayInput.value = '180000';
        return 180000;
      }

      const delay = Math.min(Math.floor(value), 600000);
      batchDelayInput.value = String(delay);
      return delay;
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('tab-single').classList.toggle('active', mode === 'single');
      document.getElementById('tab-playlist').classList.toggle('active', mode === 'playlist');
      document.getElementById('targetId').placeholder = mode === 'single' ? "粘贴单曲链接或单纯数字ID" : "粘贴歌单链接或单纯数字ID";

      msg.innerText = '';
      document.getElementById('result-single').style.display = 'none';
      document.getElementById('result-playlist').style.display = 'none';
    }

    function extractId(input) {
      if (/^\d+$/.test(input.trim())) return input.trim();
      const match = input.match(/[?&]id=(\d+)/);
      if (match && match[1]) return match[1];
      return null;
    }

    async function resolveTarget() {
      const input = document.getElementById('targetId').value;
      const targetId = extractId(input);

      msg.innerText = '';
      document.getElementById('result-single').style.display = 'none';
      document.getElementById('result-playlist').style.display = 'none';

      if (!targetId) {
        msg.innerText = '无法获取有效ID，请检查输入！';
        return;
      }

      btn.disabled = true;
      loading.style.display = 'block';

      try {
        if (mode === 'single') {
          await resolveSingle(targetId);
        } else {
          await resolvePlaylist(targetId);
        }
      } catch (err) {
        msg.innerText = err.message;
      } finally {
        loading.style.display = 'none';
        btn.disabled = false;
      }
    }

    async function resolveSingle(songId) {
      const infoRes = await fetch('/api/getSongInfo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: songId })
      });
      const infoData = await infoRes.json();
      if (!infoData.data) throw new Error(infoData.message || '获取单曲信息失败');

      const song = infoData.data;

      const urlRes = await fetch('/api/getSongUrl', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: songId, level: qualitySelect.value })
      });
      const urlData = await urlRes.json();
      if (!urlData.data || !urlData.data.url) throw new Error('获取下载链接失败，因版权或其他限制');

      currentSingleData = {
        name: song.name,
        artist: song.singer || '未知歌手',
        url: urlData.data.url
      };

      document.getElementById('s-cover').src = song.picimg || 'https://via.placeholder.com/120';
      document.getElementById('s-title').innerText = song.name;
      document.getElementById('s-artist').innerText = song.singer || '未知歌手';
      document.getElementById('s-album').innerText = '专辑：' + (song.album || '未知');
      document.getElementById('s-duration').innerText = song.duration || '00:00';
      document.getElementById('s-quality').innerText = qualitySelect.options[qualitySelect.selectedIndex].text;
      document.getElementById('s-audio').src = urlData.data.url;

      document.getElementById('result-single').style.display = 'block';
      msg.style.color = '#38b000';
      msg.innerText = '单曲解析成功！';
    }

    async function resolvePlaylist(playlistId) {
      const infoRes = await fetch('/api/getPlaylist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: playlistId })
      });
      const infoData = await infoRes.json();
      if (!infoData.data) throw new Error(infoData.message || '获取歌单信息失败');

      const pl = infoData.data;
      document.getElementById('p-cover').src = pl.coverImage || pl.picUrl || 'https://via.placeholder.com/150';
      document.getElementById('p-title').innerText = pl.name || '未知歌单';
      document.getElementById('p-desc').innerText = pl.description || '无描述';
      document.getElementById('p-creator').innerText = "创建者: " + (pl.creator?.nickname || pl.creator?.name || '未知');
      let songs = pl.songs || pl.tracks || [];
      currentPlaylistSongs = songs;
      document.getElementById('p-download-progress').innerText = '等待';
      document.getElementById('p-count').innerText = `共 ${songs.length} 首`;
      document.getElementById('p-playcount').innerText = `${pl.playCount || 0} 次播放`;

      const listDiv = document.getElementById('trackList');
      listDiv.innerHTML = '';

      songs.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = 'track-item';
        const artist = song.singer || (song.ar && song.ar.map(a => a.name).join('/')) || '未知';

        item.innerHTML = `
          <div class="track-index">${index + 1}</div>
          <div class="track-info">
            <div class="track-name" title="${song.name}">${song.name}</div>
            <div class="track-artist" title="${artist}">${artist} - ${song.album || (song.al && song.al.name) || ''}</div>
          </div>
          <div class="track-act">
            <button id="btn-${song.id}" onclick="downloadTrack('${song.id}', '${song.name.replace(/'/g, "\\'")}', '${artist.replace(/'/g, "\\'")}')">下载</button>
          </div>
        `;
        listDiv.appendChild(item);
      });

      document.getElementById('result-playlist').style.display = 'block';
      msg.style.color = '#38b000';
      msg.innerText = '歌单解析成功！';
    }

    function triggerDownloadProxy(url, name, artist) {
      let filename = `${artist} - ${name}`;
      const ext = url.includes('.flac') ? '.flac' : url.includes('.m4a') ? '.m4a' : '.mp3';
      filename += ext;
      const proxyUrl = `/download?url=${encodeURIComponent(url)}&name=${encodeURIComponent(filename)}`;
      const a = document.createElement('a');
      a.href = proxyUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function directDownloadSingle() {
      if (currentSingleData) {
        triggerDownloadProxy(currentSingleData.url, currentSingleData.name, currentSingleData.artist);
      }
    }

    async function downloadTrack(trackId, name, artist) {
      const btn = document.getElementById(`btn-${trackId}`);
      const originalText = btn.innerText;
      btn.innerText = '解析中...';
      btn.disabled = true;

      try {
        const urlRes = await fetch('/api/getSongUrl', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: trackId, level: qualitySelect.value })
        });
        const urlData = await urlRes.json();

        if (!urlData.data || !urlData.data.url) throw new Error('解析或版权限制');

        btn.innerText = '拉取中...';
        triggerDownloadProxy(urlData.data.url, name, artist);
        setTimeout(() => {
          btn.innerText = '✓ 完成';
          btn.style.background = '#38b000';
        }, 1500);
      } catch (err) {
        btn.innerText = '✗ 失败';
        btn.style.background = '#ff006e';
        alert("下载失败: " + err.message);
      } finally {
        setTimeout(() => {
          if (btn.innerText !== '✓ 完成') {
            btn.disabled = false;
            btn.innerText = originalText;
            btn.style.background = '';
          }
        }, 3000);
      }
    }

    async function downloadWholePlaylist() {
      if (isBatchDownloading) return;
      if (!currentPlaylistSongs || currentPlaylistSongs.length === 0) return;

      const btn = document.getElementById('batchDownloadBtn');
      const progressText = document.getElementById('p-download-progress');
      const delayMs = getBatchDelayMs();
      isBatchDownloading = true;
      btn.style.background = 'gray';
      batchDelayInput.disabled = true;

      try {
        for (let i = 0; i < currentPlaylistSongs.length; i++) {
          const song = currentPlaylistSongs[i];
          const artist = song.singer || (song.ar && song.ar.map(a => a.name).join('/')) || '未知';

          progressText.innerText = `正在下载 ${i + 1}/${currentPlaylistSongs.length}`;

          try {
            await downloadTrack(song.id, song.name, artist);
            // 延迟避免并发请求过多导致拦截或浏览器限制下载
            if (delayMs > 0 && i < currentPlaylistSongs.length - 1) {
              progressText.innerText = `等待 ${delayMs}ms`;
              await new Promise(r => setTimeout(r, delayMs));
            }
          } catch (e) {
            console.error("下载失败", song.name, e);
          }
        }
      } finally {
        progressText.innerText = '完成!';
        btn.style.background = 'linear-gradient(135deg, #3a86ff, #00f2fe)';
        isBatchDownloading = false;
        batchDelayInput.disabled = false;
      }
    }

    document.getElementById('targetId').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        resolveTarget();
      }
    });
  </script>
</body>

</html>
